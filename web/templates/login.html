<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Dogfood 2026</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand-group">
                <a href="/projects" class="brand-title">Dogfood 2026</a>
                <span class="event-name">{{if .EventName}}{{.EventName}}{{else}}Hackathon{{end}}</span>
            </div>
            <nav class="nav-links">
                <a href="/projects" class="nav-link">Gallery</a>
                <a href="/login" class="nav-link active">Sign In</a>
            </nav>
        </div>
    </header>

    <main class="container form-container">
        <div class="card auth-card">
            <h2>Sign In to Dogfood</h2>
            <p class="subtitle">Enter your email or select an evaluation role below.</p>

            {{if .Error}}
            <div class="alert alert-error">{{.Error}}</div>
            {{end}}

            <form action="/login" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.org" required autofocus>
                </div>
                <button type="submit" class="btn-primary btn-block">Continue with Email</button>
            </form>

            <div class="auth-divider">
                <span>OR SELECT EVALUATION ROLE</span>
            </div>

            <div class="quick-login-grid">
                <form action="/login" method="POST">
                    <input type="hidden" name="token" value="org_7f2a">
                    <button type="submit" class="btn-outline quick-btn">
                        <strong>Organizer</strong>
                        <span class="subtext">Full event & export access</span>
                    </button>
                </form>
                <form action="/login" method="POST">
                    <input type="hidden" name="token" value="jdg_a_91bc">
                    <button type="submit" class="btn-outline quick-btn">
                        <strong>Judge A (Tomas Varga)</strong>
                        <span class="subtext">Private scoring & assignments</span>
                    </button>
                </form>
                <form action="/login" method="POST">
                    <input type="hidden" name="token" value="jdg_b_44de">
                    <button type="submit" class="btn-outline quick-btn">
                        <strong>Judge B (Wei Lindqvist)</strong>
                        <span class="subtext">Independent peer judging</span>
                    </button>
                </form>
                <form action="/login" method="POST">
                    <input type="hidden" name="token" value="prt_2e88">
                    <button type="submit" class="btn-outline quick-btn">
                        <strong>Participant (Team tm_01)</strong>
                        <span class="subtext">Team projects & drafts</span>
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
